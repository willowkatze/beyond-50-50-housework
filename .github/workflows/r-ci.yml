name: R synthetic-data checks

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
      - name: Verify no raw survey datasets are tracked
        run: |
          if git ls-files 'data/raw/*' 'data/processed/*' 'outputs/*' | grep -v '/.gitkeep$' | grep .; then
            echo 'Private data/output unexpectedly tracked!' >&2
            exit 1
          fi
      - name: Run synthetic-fixture tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary")'
